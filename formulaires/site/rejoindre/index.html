<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow"><meta name="referrer" content="no-referrer">
<title>Rejoindre une fraternité Cor Unum – Paroisse La Croix glorieuse</title>
<link rel="icon" href="../logo-128.png"><link rel="apple-touch-icon" href="../logo-128.png">
<meta name="theme-color" content="#521a22">
<style>
*{box-sizing:border-box}
body{margin:0;background:#faf7f2;font-family:Arial,Helvetica,sans-serif;color:#2b2224;font-size:16px}
.entete{background:#521a22;color:#fff;padding:14px 18px;display:flex;align-items:center;gap:12px}
.entete img{width:44px;height:44px;border-radius:50%;background:#fff}
.entete b{font-family:Georgia,serif;font-size:19px;display:block}.entete span{font-size:12.5px;color:#e8c9a8}
main{max-width:560px;margin:0 auto;padding:16px}
.carte{background:#fff;border-radius:12px;box-shadow:0 1px 8px rgba(82,26,34,.07);padding:16px;margin-bottom:12px}
h1{font-family:Georgia,serif;color:#521a22;font-size:23px;margin:2px 0 8px}
h2{font-family:Georgia,serif;color:#521a22;font-size:18px;margin:18px 0 4px}
.petit{font-size:13.5px;color:#7a6a64;line-height:1.45}
input{width:100%;border:1px solid #e0d2c6;border-radius:8px;padding:11px;font:inherit;background:#fff}
label{display:block;font-size:13.5px;color:#6b5b55;margin:10px 0 4px}
.grille{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}@media(max-width:520px){.grille{grid-template-columns:1fr}}
.choix{display:flex;align-items:center;gap:10px;margin:8px 0;font-size:15px;cursor:pointer;color:#2b2224}
.choix input{width:20px;height:20px;flex:none;margin:0;accent-color:#521a22}
.bouton{display:inline-block;border:0;background:#521a22;color:#fff;border-radius:10px;padding:13px 22px;font-size:16px;font-weight:bold;cursor:pointer;margin-top:16px;width:100%}
.bouton:disabled{opacity:.6}
.info{background:#faf3ea;border-left:4px solid #d08c4c;border-radius:6px;padding:10px 12px;font-size:14.5px;margin:10px 0;line-height:1.45}
.erreur{background:#fdeceb;color:#8a1f17;border-radius:6px;padding:10px 12px;margin:10px 0}
.ok{background:#e8f5ec;color:#1d5e33;border-radius:6px;padding:12px;margin:10px 0;line-height:1.5}
.cache{display:none}
a{color:#a8662e}
</style></head>
<body>
<div class="entete"><img src="../logo-128.png" alt=""><div><b>Fraternités Cor Unum</b><span id="sous">Paroisse personnelle La Croix glorieuse</span></div></div>
<main>
  <div id="etat" class="info">Chargement…</div>
  <div id="page"></div>
</main>
<script>
(function () {
  var URL_SCRIPT = "https://script.google.com/macros/s/AKfycbzSjwHZONGGz0xfWXo_u4MJRYBon8eZZzyTvWNrgo6418zkoOXpzVDx3Q8nthP5rLAleg/exec";
  var i = new URLSearchParams(location.search).get('i') || '';
  var d = null;
  function $(id) { return document.getElementById(id); }
  function e(t) { return String(t == null ? '' : t).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }
  function appel(action, p) {
    p = p || {}; p.i = i;
    return fetch(URL_SCRIPT, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ action: action, payload: p }) })
      .then(function (r) { return r.json(); }).then(function (r) { if (!r.ok) throw new Error(r.message || 'Erreur'); return r.data; });
  }
  function erreur(t) { var z = $('z'); z.className = 'erreur'; z.textContent = t; z.style.display = 'block'; z.scrollIntoView({ block: 'center', behavior: 'smooth' }); }
  function champs(pre, titre) {
    return (titre ? '<h2>' + titre + '</h2>' : '') + '<div class="grille"><div><label for="' + pre + 'p">Prénom</label><input id="' + pre + 'p" autocomplete="' + (pre ? 'off' : 'given-name') + '"></div>' +
      '<div><label for="' + pre + 'n">Nom</label><input id="' + pre + 'n" autocomplete="' + (pre ? 'off' : 'family-name') + '"></div>' +
      '<div><label for="' + pre + 'm">E-mail</label><input id="' + pre + 'm" type="email" autocomplete="' + (pre ? 'off' : 'email') + '"></div>' +
      '<div><label for="' + pre + 't">Téléphone</label><input id="' + pre + 't" type="tel" autocomplete="' + (pre ? 'off' : 'tel') + '"></div></div>';
  }
  function formulaire() {
    var chefs = d.chefs.length ? d.chefs.join(', ') : '';
    $('page').innerHTML = '<div class="carte"><h1>Rejoindre la fraternité ' + e(d.equipe) + '</h1>' +
      '<p class="petit">Fraternités Cor Unum ' + e(d.annee) + (chefs ? ' · ' + (d.chefs.length > 1 || / et /.test(chefs) ? 'chefs' : 'chef') + ' : ' + e(chefs) : '') + '</p>' +
      '<p>Les fraternités Cor Unum réunissent régulièrement quelques foyers et personnes de la paroisse, pour prier, partager et s\'entraider. Remplissez ce formulaire pour vous inscrire.</p>' +
      champs('', '') +
      '<h2>Je suis</h2>' + d.profils.map(function (p) { return '<label class="choix"><input type="checkbox" value="' + e(p) + '" data-profil>' + e(p) + '</label>'; }).join('') +
      '<label class="choix" style="margin-top:16px"><input type="checkbox" id="couple"><b>Nous venons en couple</b></label>' +
      '<div id="conjoint" class="cache">' + champs('c', 'Mon conjoint') + '</div>' +
      '<p class="petit" style="margin-top:14px">Vos coordonnées seront transmises au chef de la fraternité et au secrétariat de la paroisse, uniquement pour la vie de la fraternité.</p>' +
      '<div id="z" style="display:none"></div><button class="bouton" id="envoyer">M\'inscrire</button></div>';
    $('couple').onchange = function () { $('conjoint').classList.toggle('cache', !this.checked); };
    $('envoyer').onclick = envoyer;
  }
  function envoyer() {
    var v = function (id) { return $(id).value.trim(); };
    var mailOk = function (m) { return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(m); };
    if (!v('p') || !v('n')) return erreur('Indiquez votre prénom et votre nom.');
    if (!mailOk(v('m'))) return erreur('Indiquez une adresse e-mail valable.');
    var couple = $('couple').checked;
    if (couple && (!v('cp') || !v('cn'))) return erreur('Indiquez le prénom et le nom de votre conjoint.');
    if (couple && !mailOk(v('cm'))) return erreur('Indiquez une adresse e-mail valable pour votre conjoint.');
    var b = $('envoyer'); b.disabled = true; b.textContent = 'Envoi…';
    appel('rej.inscrire', {
      prenoms: v('p'), nom: v('n'), email: v('m'), telephone: v('t'),
      profils: Array.prototype.filter.call(document.querySelectorAll('[data-profil]'), function (x) { return x.checked; }).map(function (x) { return x.value; }),
      couple: couple, conjoint: couple ? { prenoms: v('cp'), nom: v('cn'), email: v('cm'), telephone: v('ct') } : null
    }).then(function (r) {
      var plur = r.chefs.length > 1 || r.chefs.some(function (c) { return / et /.test(c.nom); });
      $('page').innerHTML = '<div class="carte"><h1>Bienvenue !</h1><div class="ok">Votre inscription dans la fraternité <b>' + e(r.equipe) + '</b> est enregistrée. Un mail de confirmation vient de vous être envoyé.</div>' +
        (r.chefs.length ? '<h2>' + (plur ? 'Vos chefs de fraternité' : 'Votre chef de fraternité') + '</h2>' + r.chefs.map(function (c) {
          return '<p><b>' + e(c.nom) + '</b>' + (c.telephone ? '<br><a href="tel:' + e(c.telephone.replace(/\s/g, '')) + '">' + e(c.telephone) + '</a>' : '') + (c.email ? '<br><a href="mailto:' + e(c.email) + '">' + e(c.email) + '</a>' : '') + '</p>';
        }).join('') + '<p class="petit">' + (plur ? 'Ils vous contacteront' : 'Votre chef vous contactera') + ' pour la prochaine rencontre.</p>' : '') + '</div>';
      window.scrollTo(0, 0);
    }).catch(function (er) { b.disabled = false; b.textContent = 'M\'inscrire'; erreur(er.message); });
  }
  if (!i) { $('etat').className = 'erreur'; $('etat').textContent = 'Lien incomplet. Utilisez le lien reçu du chef de la fraternité.'; return; }
  appel('rej.public').then(function (r) { d = r; $('etat').style.display = 'none'; $('sous').textContent = r.paroisse || $('sous').textContent; formulaire(); })
    .catch(function (er) { $('etat').className = 'erreur'; $('etat').textContent = er.message; });
})();
</script>
</body></html>
