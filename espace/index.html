    if (ev.target.dataset && ev.target.dataset.lettre) {
      var fs = [].slice.call(ev.target.files || []); if (!fs.length) return;

      if (pdfs.length) {
        if (fs.length > 1 || lettrePages.length) { message('zl', 'Choisissez soit un seul PDF, soit des photos.'); return; }

        var rp = new FileReader(); rp.onload = function () { lettrePdf = { nom: pdfs[0].name, b64: String(rp.result).split(',')[1] }; rendre(); }; rp.readAsDataURL(pdfs[0]);
        return;
      }
      if (lettrePages.length + fs.length > 12) { message('zl', '12 pages au plus.'); return; }
      message('zl', 'Préparation des pages…', true);
      Promise.all(fs.map(pageLettre)).then(function (l) { lettrePages = lettrePages.concat(l); rendre(); }).catch(function (er) { message('zl', er.message); });
      return;
    }
    var piece = ev.target.dataset && ev.target.dataset.piece; if (!piece) return;
    var f = ev.target.files[0]; if (!f) return;
    if (f.size > 10 * 1024 * 1024) { message('zp', 'Fichier trop lourd (10 Mo au plus).'); return; }
    message('zp', 'Envoi en cours…', true);
    var rd = new FileReader();
    rd.onload = function () {
      (piece === 'photo' ? vignette(f) : Promise.resolve('')).then(function (mini) { return appel('esp.piece', { doc: piece, nom: f.name, type: f.type || 'image/jpeg', base64: String(rd.result).split(',')[1], mini: mini }); })
        .then(function (r) { d = r; rendre(); message('zp', 'Pièce déposée. Merci !', true); }).catch(function (er) { message('zp', er.message); });
    };
    rd.readAsDataURL(f);
  });

  // Vignette de la photo (240 px), réduite sur le téléphone avant l'envoi
  function vignette(f) {
    return new Promise(function (ok) {
      if (!/^image\//.test(f.type || '')) return ok('');
      var u = URL.createObjectURL(f), im = new Image();
      im.onload = function () { try { var k = Math.min(1, 240 / Math.max(im.width, im.height)), c = document.createElement('canvas'); c.width = Math.round(im.width * k); c.height = Math.round(im.height * k); c.getContext('2d').drawImage(im, 0, 0, c.width, c.height); ok(c.toDataURL('image/jpeg', 0.8)); } catch (x) { ok(''); } URL.revokeObjectURL(u); };
      im.onerror = function () { URL.revokeObjectURL(u); ok(''); };

        .then(function () { rendre(); });

  }
  window.addEventListener('beforeinstallprompt', function (ev) { ev.preventDefault(); installer = ev; if (d && vue === 'accueil') rendre(); });
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(function () {});
  try { if ('caches' in window && !APERCU) caches.open('croix-glorieuse-infos').then(function (k) { k.put('url', new Response(URL_SCRIPT)); }); } catch (x) {}

  function charger() {
    $('etat').style.display = 'block'; $('etat').className = 'info'; $('etat').textContent = 'Chargement…';
    appel('esp.lire').then(function (r) { d = r; horsLigne = false; brouillon = null; $('etat').style.display = 'none'; garderHorsLigne(); rendre(); finDemarrage(); chargerFete(); })
      .catch(function (er) { if (er.code === 'SESSION') return; if (!er.code && reprendreHorsLigne()) return; $('etat').className = 'erreur'; $('etat').textContent = er.message; });
  }
  // ─── Actualisation au retour dans l'app (après 30 secondes ailleurs), sauf pendant une saisie ───
  var cacheeLe = 0;
  function saisieEnCours() { var a = document.activeElement; return !!(a && /^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName)) || !!brouillon || suppression || !!demandeSac || ajoutParrain || demandeCor || foyerQuitter; }
  function actualiserApp() {

    appelCpt('public.fonctions').then(function (f) { if (majFonctions(f) && d && !saisieEnCours()) rendre(); }).catch(function () {});
    if (!d || MODE === 'v' || horsLigne === undefined || saisieEnCours()) return;
    var req = MODE === 'p' ? appelCpt('cpt.lire') : appel('esp.lire');
    req.then(function (r) {
      if (saisieEnCours() || (MODE === 'p' && r.espace && r.espace.c)) return;
      d = r; horsLigne = false; afaire = null;
      if (MODE === 'p') { try { localStorage.setItem('cpt_d', JSON.stringify(r)); } catch (x) {} } else garderHorsLigne();
      if (vue === 'propositions' && !propOuverte) chargerProps(true);
      if (vue === 'priere') chargerPriere(true);
      if (vue === 'sacrements') chargerSacrements(true);
      if (vue === 'messe') chargerMesses(true);
      if (vue === 'inscriptions') inscriptions = null;
      rendre();
    }).catch(function () {});
  }
  document.addEventListener('visibilitychange', function () {
    if (document.visibilityState === 'hidden') { cacheeLe = Date.now(); return; }
    if (cacheeLe && Date.now() - cacheeLe > 30000) actualiserApp();
  });
  function finDemarrage() { var z = $('demarrage'); if (z && !z.classList.contains('fini')) { z.classList.add('fini'); setTimeout(function () { z.remove(); }, 500); } }
  setTimeout(finDemarrage, 2500);   // au plus tard (connexion lente, écran de mot de passe…)
  function demarrer() {
    $('page').innerHTML = '';
    appel('esp.etat').then(function (r) { acces = r; if (r.session) charger(); else { etape = 'mdp'; ecranConnexion(); } })
      .catch(function (er) { if (!er.code && reprendreHorsLigne()) return; $('nav').classList.add('cache'); $('etat').style.display = 'block'; $('etat').className = 'erreur'; $('etat').textContent = er.message; });
  }

  if (!APERCU) appelCpt('public.fonctions').then(function (f) { if (majFonctions(f) && d) rendre(); }).catch(function () {});
  if (APERCU) demarrer();
  else if (INVIT) ecranInvitation();
