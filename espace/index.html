<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow"><meta name="referrer" content="no-referrer">
<title>Croix glorieuse</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#521a22"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Croix glorieuse">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:#faf7f2;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;color:#2b2224;font-size:16px}
.entete{background:#521a22;color:#fff;padding:calc(12px + env(safe-area-inset-top)) 16px 12px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:5}
.entete img{width:40px;height:40px;border-radius:50%;background:#fff}
.entete b{font-family:Georgia,serif;font-size:19px;display:block}.entete span{font-size:12.5px;color:#e8c9a8}
main{max-width:640px;margin:0 auto;padding:14px 14px calc(90px + env(safe-area-inset-bottom))}
.carte{background:#fff;border-radius:14px;box-shadow:0 1px 8px rgba(82,26,34,.07);padding:16px;margin-bottom:14px}
h1{font-family:Georgia,serif;color:#521a22;font-size:24px;margin:2px 0 8px}
h2{font-family:Georgia,serif;color:#521a22;font-size:19px;margin:0 0 10px}
.petit{font-size:13.5px;color:#7a6a64;line-height:1.45}
a{color:#a8662e}
input,textarea,select{width:100%;border:1px solid #e0d2c6;border-radius:10px;padding:11px;font:inherit;background:#fff;color:inherit}
textarea{min-height:120px;line-height:1.5}
label{display:block;font-size:13px;color:#6b5b55;margin:10px 0 4px}
.grille{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}@media(max-width:520px){.grille{grid-template-columns:1fr}}
.bouton{display:inline-block;border:1px solid #e6d8cc;background:#fff;color:#521a22;border-radius:10px;padding:11px 16px;font-size:15px;cursor:pointer;margin:10px 8px 0 0;text-decoration:none}
.principal{background:#521a22;color:#fff;border-color:#521a22;font-weight:600}
.lien{background:none;border:0;color:#a8662e;text-decoration:underline;cursor:pointer;font-size:14px;padding:8px 0}
.info{background:#faf3ea;border-left:4px solid #d08c4c;border-radius:8px;padding:10px 12px;font-size:14.5px;margin:10px 0;line-height:1.45}
.erreur{background:#fdeceb;color:#8a1f17;border-radius:8px;padding:10px 12px;margin:10px 0}
.ok{background:#e8f5ec;color:#1d5e33;border-radius:8px;padding:10px 12px;margin:10px 0}
.nav{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid #eee2d8;display:flex;padding-bottom:env(safe-area-inset-bottom);z-index:5}
.nav button{flex:1;background:none;border:0;padding:9px 2px 8px;font-size:11.5px;color:#7a6a64;cursor:pointer;position:relative}
.nav button b{display:block;font-size:21px;line-height:1.1;margin-bottom:2px;font-weight:400}
.nav button.actif{color:#521a22;font-weight:600}
.pastille{position:absolute;top:5px;left:calc(50% + 8px);background:#d08c4c;color:#fff;border-radius:999px;font-size:10.5px;padding:1px 6px}
.etape{display:flex;gap:12px;align-items:flex-start;padding:8px 0}
.rond{width:26px;height:26px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;font-size:13px;border:2px solid #e6d8cc;color:#a8998f}
.rond.fait{background:#521a22;border-color:#521a22;color:#fff}
.rond.prochaine{border-color:#d08c4c;color:#d08c4c}
.evenement{display:flex;gap:12px;padding:10px 0;border-top:1px solid #f1e8e1}.evenement:first-child{border-top:0}
.date{width:52px;flex:none;text-align:center;background:#faf3ea;border-radius:10px;padding:6px 0;color:#521a22}
.date b{display:block;font-size:20px;line-height:1}.date span{font-size:11.5px;text-transform:uppercase}
.texte{border-top:1px solid #f1e8e1;padding:12px 0;cursor:pointer}.texte:first-child{border-top:0}
.nouveau{display:inline-block;background:#d08c4c;color:#fff;border-radius:999px;font-size:11px;padding:1px 7px;margin-left:6px;vertical-align:middle}
.corps{white-space:pre-wrap;line-height:1.6;font-size:16px}
.piece{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid #f1e8e1}.piece:first-of-type{border-top:0}
.piece span{flex:1}
.cache{display:none}
main.t2{zoom:1.15}main.t3{zoom:1.3}
.taille{display:flex;align-items:center;gap:6px;justify-content:flex-end;margin:-4px 0 8px}
.taille button{border:1px solid #e6d8cc;background:#fff;color:#521a22;border-radius:8px;padding:4px 10px;cursor:pointer;font-weight:bold}
.taille button:disabled{opacity:.35}
.horsligne{background:#f1e8e1;color:#5b4a45;border-radius:8px;padding:8px 12px;margin:0 0 12px;font-size:14px}
.membres{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}.membres span{background:#f6f1ec;border-radius:999px;padding:3px 10px;font-size:13.5px}
.parrain{border-top:1px solid #f1e8e1;padding:10px 0}.parrain:first-of-type{border-top:0}
.signaler{margin-top:6px;border-top:1px dashed #eee2d8;padding-top:4px}
.sig{border-top:1px solid #f1e8e1;padding:10px 0}.sig:first-of-type{border-top:0}
.statut{display:inline-block;border-radius:999px;font-size:11.5px;padding:1px 8px;margin-left:6px}
.statut.ouvert{background:#faf3ea;color:#a8662e}.statut.traite{background:#e8f5ec;color:#1d5e33}
.reponse{background:#f6f1ec;border-radius:8px;padding:8px 10px;margin-top:6px;font-size:14.5px}
</style></head>
<body>
<div class="entete"><img src="icon-192.png" alt=""><div><b>Croix glorieuse</b><span id="sous">Paroisse personnelle La Croix glorieuse</span></div></div>
<main><div id="etat" class="info">Chargement…</div><div id="page"></div></main>
<nav class="nav cache" id="nav">
  <button data-vue="accueil" class="actif"><b>⌂</b>Accueil</button>
  <button data-vue="textes"><b>✎</b>Textes<span class="pastille cache" id="nbn"></span></button>
  <button data-vue="bible"><b>✝</b>Bible</button>
  <button data-vue="calendrier"><b>▦</b>Calendrier</button>
  <button data-vue="dossier"><b>☰</b>Mon dossier</button>
</nav>
<script src="agenda.js"></script>
<script src="bible.js"></script>
<script>
(function () {
  var URL_SCRIPT = __URL_SCRIPT__;
  var ETAPES = [['accueil', 'Premier accueil'], ['accompagnateur', 'Accompagnateur désigné'], ['entree', 'Entrée en catéchuménat'], ['lettre', 'Lettre à l\'évêque'],
    ['appel', 'Appel décisif'], ['scrutins', 'Scrutins'], ['sacrements', 'Baptême, confirmation, eucharistie'], ['registre', 'Inscription au registre']];
  var CHAMPS = [['Identité', [['prenoms', 'Prénoms'], ['nom', 'Nom'], ['sexe', 'Homme ou femme', ['', 'Homme', 'Femme']], ['nom_jeune_fille', 'Nom de jeune fille'], ['naissance_date', 'Né(e) le', 'date'], ['naissance_lieu', 'À'], ['nationalite', 'Nationalité'], ['profession', 'Profession']]],
    ['Coordonnées', [['adresse', 'Adresse'], ['telephone', 'Téléphone', 'tel'], ['email', 'E-mail', 'email']]],
    ['Situation', [['situation', 'Situation familiale', ['', 'Célibataire', 'Marié(e)', 'Pacsé(e)', 'Vie maritale', 'Divorcé(e)', 'Veuf / veuve']], ['conjoint', 'Époux / épouse']]],
    ['Parents', [['pere_prenom', 'Prénom du père'], ['pere_nom', 'Nom du père'], ['mere_prenom', 'Prénom de la mère'], ['mere_nom_jeune_fille', 'Nom de jeune fille de la mère']]],
    ['Prénom de baptême', [['prenom_bapteme', 'Prénom de baptême']], 'Choisir un nouveau prénom n\'est pas obligatoire, sauf si votre prénom de naissance n\'est pas celui d\'un saint ou d\'une sainte du calendrier catholique. Dans ce cas, choisissez le prénom d\'un saint ou d\'une sainte qui vous accompagnera : il s\'ajoutera à vos prénoms dans le registre des baptêmes.']];
  var q = new URLSearchParams(location.search), c = q.get('c') || '';
  try { if (c) { localStorage.setItem('esp_c', c); history.replaceState(null, '', location.pathname); } else c = localStorage.getItem('esp_c') || ''; } catch (x) {}
  var d = null, vue = 'accueil', ouvert = null, acces = null, etape = 'mdp', mailCode = '', brouillon = null, installer = null, signale = null, sigTexte = '', lettreB = null, horsLigne = false, taille = 1, ajoutParrain = false, retraitParrain = null, demandeCor = false;
  function $(id) { return document.getElementById(id); }
  function e(t) { return String(t == null ? '' : t).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }
  function liens(t) { return e(t).replace(/(https?:\/\/[^\s<]+)/g, '<a href="$1" target="_blank" rel="noopener">$1</a>'); }
  function session() { try { return localStorage.getItem('esp_s_' + c) || ''; } catch (x) { return ''; } }
  function ecrireSession(v) { try { if (v) localStorage.setItem('esp_s_' + c, v); else localStorage.removeItem('esp_s_' + c); } catch (x) {} }
  function appel(action, p) {
    p = p || {}; p.c = c; p.session = session();
    return fetch(URL_SCRIPT, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ action: action, payload: p }) })
      .then(function (r) { return r.json(); }).then(function (r) {
        if (!r.ok) { if (r.code === 'SESSION') { ecrireSession(''); try { localStorage.removeItem('esp_d_' + c); } catch (x) {} demarrer(); } var er = new Error(r.message || 'Erreur'); er.code = r.code; throw er; }
        return r.data;
      });
  }
  function jour(iso, opts) { try { return new Date(String(iso).slice(0, 10) + 'T12:00:00').toLocaleDateString('fr-FR', opts || { weekday: 'long', day: 'numeric', month: 'long' }); } catch (x) { return iso; } }
  function message(z, t, ok) { var el = $(z); if (el) { el.className = ok ? 'ok' : 'erreur'; el.textContent = t; el.style.display = 'block'; } }

  // ─── Connexion ───
  function ecranConnexion() {
    $('nav').classList.add('cache'); $('etat').style.display = 'none';
    var h = '<div class="carte"><h1>Bonjour' + (acces && acces.prenom ? ' ' + e(acces.prenom) : '') + '</h1>';
    if (etape === 'mdp' && acces.mot_de_passe) {
      h += '<p class="petit">Votre espace personnel de la paroisse.</p><form id="f1"><label>Mot de passe</label><input id="m1" type="password" autocomplete="current-password" required><button class="bouton principal" type="submit">Se connecter</button></form><div id="zc" style="display:none"></div><button class="lien" data-a="code">Mot de passe oublié ?</button>';
    } else if (etape === 'mdp') {
      h += '<p>Bienvenue dans votre espace personnel : votre parcours, le calendrier, les textes que la paroisse vous envoie, et votre dossier à compléter.</p><p class="petit">Pour le protéger, choisissez un mot de passe. Un code va être envoyé ' + (acces.mail ? 'à ' + e(acces.mail) : 'à votre adresse e-mail') + '.</p><button class="bouton principal" data-a="code">Choisir mon mot de passe</button><div id="zc" style="display:none"></div>';
    } else {
      h += '<p class="petit">Un code à 6 chiffres vient d\'être envoyé à ' + e(mailCode) + ' (valable 15 minutes).</p><form id="f2"><label>Code reçu par mail</label><input id="m2" inputmode="numeric" autocomplete="one-time-code" maxlength="6" required>' +
        '<label>Nouveau mot de passe (8 caractères au moins)</label><input id="m3" type="password" autocomplete="new-password" minlength="8" required><label>Le même, une seconde fois</label><input id="m4" type="password" autocomplete="new-password" minlength="8" required>' +
        '<button class="bouton principal" type="submit">Valider</button></form><div id="zc" style="display:none"></div><button class="lien" data-a="code">Renvoyer un code</button>';
    }
    $('page').innerHTML = h + '</div>';
    var f1 = $('f1'), f2 = $('f2');
    if (f1) f1.onsubmit = function (ev) { ev.preventDefault(); appel('esp.connexion', { mdp: $('m1').value }).then(function (r) { ecrireSession(r.session); charger(); }).catch(function (er) { message('zc', er.message); }); };
    if (f2) f2.onsubmit = function (ev) {
      ev.preventDefault();
      if ($('m3').value !== $('m4').value) { message('zc', 'Les deux mots de passe ne sont pas identiques.'); return; }
      appel('esp.definir', { code: $('m2').value, mdp: $('m3').value }).then(function (r) { ecrireSession(r.session); etape = 'mdp'; charger(); }).catch(function (er) { message('zc', er.message); });
    };
  }

  // ─── Pages ───
  function prochaineEtape() { for (var i = 0; i < ETAPES.length; i++) if (!(d.etapes[ETAPES[i][0]] && d.etapes[ETAPES[i][0]].fait)) return i; return -1; }
  function carteEvenement(ev) {
    var dt = new Date(String(ev.date).slice(0, 10) + 'T12:00:00');
    return '<div class="evenement"><div class="date"><b>' + dt.getDate() + '</b><span>' + dt.toLocaleDateString('fr-FR', { month: 'short' }).replace('.', '') + '</span></div><div style="flex:1"><b>' + e(ev.titre) + '</b>' +
      '<div class="petit" style="text-transform:capitalize">' + e(jour(ev.date)) + (ev.date_fin && ev.date_fin !== ev.date ? ' → ' + e(jour(ev.date_fin)) : '') + (ev.heure_debut ? ', ' + e(ev.heure_debut) + (ev.heure_fin ? ' – ' + e(ev.heure_fin) : '') : '') + '</div>' +
      (ev.lieu ? '<div class="petit">' + e(ev.lieu) + '</div>' : '') + (ev.note ? '<div class="petit">' + e(ev.note) + '</div>' : '') +
      (ev.lien ? '<a class="bouton" href="' + e(ev.lien) + '" target="_blank" rel="noopener">S\'inscrire</a>' : '') + '</div></div>';
  }
  // ─── Signaler une erreur ───
  function blocSignaler(sujet) {
    if (signale !== sujet) return '<div class="signaler"><button class="lien" data-a="signaler" data-sujet="' + e(sujet) + '">Signaler une erreur</button></div>';
    return '<div class="signaler"><label>Quelle erreur avez-vous remarquée ? (' + e(sujet) + ')</label><textarea id="sigtexte" style="min-height:90px" placeholder="Ex. : l\'étape « Entrée en catéchuménat » est cochée mais je ne l\'ai pas encore vécue.">' + e(sigTexte) + '</textarea>' +
      '<div id="zs" style="display:none"></div><button class="bouton principal" data-a="signaler-envoyer" data-sujet="' + e(sujet) + '">Envoyer</button><button class="bouton" data-a="signaler-annuler">Annuler</button></div>';
  }
  function blocSignalements() {
    var l = d.signalements || [];
    if (!l.length) return '';
    return '<div class="carte"><h2>Mes signalements</h2>' + l.map(function (z) {
      return '<div class="sig"><b>' + e(z.sujet) + '</b><span class="statut ' + (z.statut === 'traite' ? 'traite">Corrigé' : 'ouvert">Envoyé') + '</span>' +
        '<div class="petit">' + e(jour(z.date, { day: 'numeric', month: 'long', year: 'numeric' })) + '</div><div style="margin-top:4px;white-space:pre-wrap">' + e(z.texte) + '</div>' +
        (z.statut === 'traite' ? '<div class="reponse"><b>Réponse de la paroisse</b>' + (z.traite_le ? ' <span class="petit">(' + e(jour(z.traite_le, { day: 'numeric', month: 'long' })) + ')</span>' : '') + '<br>' + (z.reponse ? e(z.reponse) : 'C\'est corrigé. Merci !') + '</div>' : '') + '</div>';
    }).join('') + '</div>';
  }
  // ─── Taille du texte (retenue sur le téléphone) ───
  try { taille = Number(localStorage.getItem('esp_taille')) || 1; } catch (x) {}
  function appliquerTaille() { var m = document.querySelector('main'); m.classList.remove('t2', 't3'); if (taille > 1) m.classList.add('t' + taille); }
  appliquerTaille();
  function blocTaille() { return '<div class="taille"><span class="petit">Taille du texte</span><button data-a="taille-moins" ' + (taille <= 1 ? 'disabled' : '') + ' aria-label="Texte plus petit">A−</button><button data-a="taille-plus" ' + (taille >= 3 ? 'disabled' : '') + ' aria-label="Texte plus grand">A+</button></div>'; }
  // ─── Hors connexion : dernière vue gardée, seulement les textes déjà ouverts ───
  function ouvertsLocaux() { try { return JSON.parse(localStorage.getItem('esp_ouverts_' + c) || '[]'); } catch (x) { return []; } }
  function noterOuvert(id) { try { var l = ouvertsLocaux(); if (l.indexOf(id) === -1) { l.push(id); localStorage.setItem('esp_ouverts_' + c, JSON.stringify(l)); } } catch (x) {} }
  function garderHorsLigne() {
    try {
      var o = ouvertsLocaux(), copie = JSON.parse(JSON.stringify(d));
      copie.textes = copie.textes.filter(function (t) { return o.indexOf(t.id) > -1; });
      localStorage.setItem('esp_d_' + c, JSON.stringify(copie));
    } catch (x) {}
  }
  function reprendreHorsLigne() {
    try { var x = JSON.parse(localStorage.getItem('esp_d_' + c) || 'null'); if (x) { d = x; horsLigne = true; vue = 'textes'; ouvert = null; $('etat').style.display = 'none'; rendre(); return true; } } catch (y) {}
    return false;
  }

  // ─── Ma fraternité Cor Unum ───
  function blocFraternite() {
    var f = d.fraternite || { etat: 'aucune' };
    if (f.etat === 'membre') {
      var plur = f.chefs.length > 1 || f.chefs.some(function (x) { return / et /.test(x.nom); });
      return '<div class="carte"><h2>Ma fraternité Cor Unum</h2><p>Fraternité <b>' + e(f.equipe) + '</b></p>' +
        (f.chefs.length ? '<p class="petit" style="margin-bottom:2px">' + (plur ? 'Chefs' : 'Chef') + ' de fraternité</p>' + f.chefs.map(function (x) {
          return '<div><b>' + e(x.nom) + '</b>' + (x.telephone ? ' · <a href="tel:' + e(x.telephone.replace(/\s/g, '')) + '">' + e(x.telephone) + '</a>' : '') + (x.email ? ' · <a href="mailto:' + e(x.email) + '">' + e(x.email) + '</a>' : '') + '</div>';
        }).join('') : '') +
        (f.rencontres.length ? '<p class="petit" style="margin:12px 0 0">' + (f.rencontres.length > 1 ? 'Prochaines rencontres' : 'Prochaine rencontre') + '</p>' + f.rencontres.map(function (r) {
          return '<div><b style="text-transform:capitalize">' + e(jour(r.date)) + '</b>' + (r.lieu ? ' · ' + e(r.lieu) : '') + (r.note ? '<div class="petit">' + e(r.note) + '</div>' : '') + '</div>';
        }).join('') : '<p class="petit" style="margin-top:12px">La prochaine rencontre n\'est pas encore fixée.</p>') +
        (f.membres.length ? '<p class="petit" style="margin:12px 0 0">Membres</p><div class="membres">' + f.membres.map(function (m) { return '<span>' + (m.chef ? '♛ ' : '') + e(m.prenoms) + '</span>'; }).join('') + '</div>' : '') + '</div>';
    }
    if (f.etat === 'demande') return '<div class="carte"><h2>Fraternités Cor Unum</h2><div class="ok">Votre demande est envoyée : la paroisse va vous proposer une fraternité et vous mettre en relation avec son chef.</div></div>';
    return '<div class="carte"><h2>Fraternités Cor Unum</h2><p>Les fraternités Cor Unum réunissent régulièrement quelques foyers et personnes de la paroisse, pour prier, partager et s\'entraider. Elles sont un beau soutien sur le chemin du baptême.</p>' +
      (demandeCor ? '<label>Vos préférences (facultatif)</label><textarea id="corprefs" style="min-height:80px" placeholder="Quartier, jour de la semaine, personne que vous aimeriez retrouver…"></textarea><div id="zcor" style="display:none"></div>' +
        '<button class="bouton principal" data-a="cor-envoyer">Envoyer ma demande</button><button class="bouton" data-a="cor-annuler">Annuler</button>'
        : '<button class="bouton principal" data-a="cor-demande">Je veux rejoindre une fraternité Cor Unum</button>') + '</div>';
  }

  // ─── Parrain et marraine ───
  function blocParrains() {
    var l = d.parrains || [], ROLE = { parrain: 'Parrain', marraine: 'Marraine' };
    var h = '<div class="carte"><h2>Parrain et marraine</h2>' + (d.neophyte ? '' : '<p class="petit">Un parrain, une marraine, ou les deux. Chacun reçoit son propre lien pour déposer son certificat de baptême et de confirmation et voir les dates importantes.</p>');
    h += l.map(function (z) {
      return '<div class="parrain"><b>' + e(ROLE[z.role]) + ' : ' + e(z.nom) + '</b><div class="petit">' + e(z.email || 'pas d\'adresse e-mail') + '</div>' +
        '<div class="petit">' + (z.cert_le ? '✅ Certificat déposé le ' + e(jour(z.cert_le, { day: 'numeric', month: 'long' })) : z.envoye_le ? 'Lien envoyé le ' + e(jour(z.envoye_le, { day: 'numeric', month: 'long' })) + ' · certificat pas encore déposé' : 'Lien pas encore envoyé') + '</div>' +
        (d.neophyte ? '' : (retraitParrain === z.id ? '<div class="info">Retirer ' + e(z.nom) + ' ?<br><button class="bouton principal" data-a="parrain-retirer-ok" data-id="' + z.id + '">Oui, retirer</button><button class="bouton" data-a="parrain-retirer-non">Annuler</button></div>' :
          (z.email && !z.cert_le ? '<button class="bouton' + (z.envoye_le ? '' : ' principal') + '" data-a="parrain-envoyer" data-id="' + z.id + '">' + (z.envoye_le ? 'Renvoyer le lien' : 'Envoyer le lien par mail') + '</button>' : '') +
          '<button class="bouton" data-a="parrain-copier" data-lien="' + e(z.lien) + '">Copier le lien</button><button class="lien" data-a="parrain-retirer" data-id="' + z.id + '" style="margin-left:6px">Retirer</button>')) + '</div>';
