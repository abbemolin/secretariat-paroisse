name: Envoyer le serveur vers Apps Script

# À chaque fusion sur main qui touche au serveur : tests, puis envoi de tous les fichiers de backend/
# dans le projet Apps Script (les fichiers absents de GitHub sont retirés), nouvelle version,
# et mise à jour du déploiement web existant (même adresse /exec). Rien n'est envoyé si un test échoue.
# Prérequis (une fois) : secret CLASPRC_JSON = contenu de ~/.clasprc.json obtenu par « clasp login »
# avec le compte propriétaire du projet (voir README, section « Envoi automatique du serveur »).

on:
  push:
    branches: [main]
    paths: ['backend/**', 'tests/**', '.github/workflows/serveur.yml']
  workflow_dispatch:

concurrency:
  group: serveur
  cancel-in-progress: false

env:
  SCRIPT_ID: 1uZcXSsElwn-vOJruKelgVj3oDNxc33RPNWR-_v2MFytqzQlTGmioqGhP
  DEPLOIEMENT_ID: AKfycbzSjwHZONGGz0xfWXo_u4MJRYBon8eZZzyTvWNrgo6418zkoOXpzVDx3Q8nthP5rLAleg

jobs:
  envoyer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Tests du serveur
        run: sh outils/tests.sh
      - name: Autorisation Google
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
        run: |
          if [ -z "$CLASPRC_JSON" ]; then echo "::error::Secret CLASPRC_JSON manquant : voir README, « Envoi automatique du serveur »."; exit 1; fi
          printf '%s' "$CLASPRC_JSON" > ~/.clasprc.json
          printf '{"scriptId":"%s","rootDir":"."}' "$SCRIPT_ID" > backend/.clasp.json
      - name: Envoi des fichiers
        working-directory: backend
        run: npx -y @google/clasp@2.4.2 push --force
      - name: Nouvelle version et déploiement web mis à jour
        working-directory: backend
        run: npx -y @google/clasp@2.4.2 deploy --deploymentId "$DEPLOIEMENT_ID" --description "GitHub ${GITHUB_SHA::7}"
      - name: Nettoyage
        if: always()
        run: rm -f ~/.clasprc.json backend/.clasp.json
