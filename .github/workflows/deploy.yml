name: Déployer l'appli sur GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Tests du serveur (rien n'est publié si un test échoue)
        run: sh ../outils/tests.sh
      - run: npm ci
      - run: npm run build
        env:
          # Facultatif : Settings → Secrets and variables → Actions → Variables → API_URL
          VITE_API_URL: ${{ vars.API_URL }}
      - name: Fichiers du serveur (lus par MiseAJour.gs pour se mettre à jour tout seul)
        run: node ../outils/publier-serveur.js dist
      - uses: actions/upload-pages-artifact@v3
        with:
          path: app/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
