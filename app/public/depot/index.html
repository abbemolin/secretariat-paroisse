<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow"><meta name="referrer" content="no-referrer">
<title>Documents à déposer – Paroisse La Croix glorieuse</title>
<link rel="icon" href="../logo-128.png"><link rel="apple-touch-icon" href="../logo-128.png">
<meta name="theme-color" content="#521a22">
<!-- Pièces envoyées plus tard : lien personnel d'un dossier (?d=…). Seules les pièces demandées par le secrétariat sont proposées. -->
<style>
*{box-sizing:border-box}
body{margin:0;background:#faf7f2;font-family:Arial,Helvetica,sans-serif;color:#2b2224;font-size:16px}
.entete{background:#521a22;color:#fff;padding:14px 18px;display:flex;align-items:center;gap:12px}
.entete img{width:44px;height:44px;border-radius:50%;background:#fff}
.entete b{font-family:Georgia,serif;font-size:19px;display:block}.entete span{font-size:12.5px;color:#e8c9a8}
main{max-width:560px;margin:0 auto;padding:16px}
.carte{background:#fff;border-radius:12px;box-shadow:0 1px 8px rgba(82,26,34,.07);padding:16px;margin-bottom:12px}
h1{font-family:Georgia,serif;color:#521a22;font-size:23px;margin:2px 0 8px}
p{line-height:1.5}
.petit{font-size:13.5px;color:#7a6a64;line-height:1.45}
.piece{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid #f0e6dc}
.piece:first-of-type{border-top:0}
.piece .nom{flex:1;font-size:15.5px}
.recu{color:#1d5e33;font-weight:bold;font-size:14px;white-space:nowrap}
.bouton{display:inline-block;border:0;background:#521a22;color:#fff;border-radius:10px;padding:11px 16px;font-size:15px;font-weight:bold;cursor:pointer;white-space:nowrap}
.bouton:disabled{opacity:.6;cursor:wait}
.info{background:#faf3ea;border-left:4px solid #d08c4c;border-radius:6px;padding:10px 12px;font-size:14.5px;margin:10px 0;line-height:1.45}
.erreur{background:#fdeceb;color:#8a1f17;border-radius:6px;padding:10px 12px;margin:10px 0}
.ok{background:#e8f5ec;color:#1d5e33;border-radius:6px;padding:12px;margin:10px 0;line-height:1.5}
input[type=file]{display:none}
</style></head>
<body>
<div class="entete"><img src="../logo-128.png" alt=""><div><b>Documents à déposer</b><span id="sous">Paroisse personnelle La Croix glorieuse</span></div></div>
<main>
  <div id="etat" class="info">Chargement…</div>
  <div id="page"></div>
</main>
<script>
(function () {
  var URL_SCRIPT = "https://script.google.com/macros/s/AKfycbzSjwHZONGGz0xfWXo_u4MJRYBon8eZZzyTvWNrgo6418zkoOXpzVDx3Q8nthP5rLAleg/exec";
  var jeton = new URLSearchParams(location.search).get('d') || '';
  var d = null, occupe = '';
  function $(id) { return document.getElementById(id); }
  function e(t) { return String(t == null ? '' : t).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }
  function appel(action, p) {
    p = p || {}; p.d = jeton;
    return fetch(URL_SCRIPT, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ action: action, payload: p }) })
      .then(function (r) { return r.json(); }).then(function (r) { if (!r.ok) throw new Error(r.message || 'Erreur'); return r.data; });
  }
  function message(t, classe) { var z = $('z'); if (!z) return; z.className = classe || 'erreur'; z.textContent = t; z.style.display = t ? 'block' : 'none'; }
  function afficher() {
    if (d.complet) {
      $('page').innerHTML = '<div class="carte"><h1>Merci !</h1><div class="ok">Tous les documents demandés ont bien été reçus par le secrétariat de la paroisse.</div></div>';
      return;
    }
    $('page').innerHTML = '<div class="carte"><h1>Documents à déposer</h1>' +
      '<p>' + (d.prenom ? 'Pour le dossier de <strong>' + e(d.prenom) + '</strong> (' + e(d.sacrement.toLowerCase()) + '). ' : '') +
      'Déposez chaque document dès que vous l\'avez : une photo bien lisible ou un PDF. Vous pouvez revenir sur cette page plus tard avec le même lien.</p>' +
      d.docs.map(function (x) {
        return '<div class="piece"><span class="nom">' + e(x.libelle) + '</span>' + (x.recu ? '<span class="recu">✓ Reçu</span>'
          : '<label class="bouton" for="f-' + e(x.cle) + '" id="b-' + e(x.cle) + '">' + (occupe === x.cle ? 'Envoi…' : 'Déposer') + '</label>' +
            '<input type="file" id="f-' + e(x.cle) + '" data-cle="' + e(x.cle) + '" accept="application/pdf,image/*,.heic,.heif">') + '</div>';
      }).join('') +
      '<div id="z" style="display:none"></div>' +
      '<p class="petit">🔒 Ces documents servent seulement à la préparation du sacrement ; seuls les prêtres et le secrétariat de la paroisse les voient. Responsable : la paroisse, représentée par le curé — secretariat@croix-glorieuse.org.</p></div>';
    Array.prototype.forEach.call(document.querySelectorAll('input[type=file]'), function (inp) {
      inp.addEventListener('change', function () { if (inp.files && inp.files[0]) deposer(inp.getAttribute('data-cle'), inp.files[0]); });
    });
  }
  // Photo : réduite (2000 px au plus, JPEG) pour un envoi rapide depuis un téléphone ; PDF et HEIC envoyés tels quels
  function preparer(f) {
    return new Promise(function (ok, ko) {
      var lire = function (blob, nom, type) {
        var r = new FileReader();
        r.onload = function () { ok({ nom: nom, type: type, base64: String(r.result).split(',')[1] }); };
        r.onerror = function () { ko(new Error('Lecture du fichier impossible.')); };
        r.readAsDataURL(blob);
      };
      if (!/^image\/(jpeg|png|webp)$/i.test(f.type || '')) return lire(f, f.name, f.type || '');
      var img = new Image(), url = URL.createObjectURL(f);
      img.onload = function () {
        var k = Math.min(1, 2000 / Math.max(img.width, img.height)), c = document.createElement('canvas');
        c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
        URL.revokeObjectURL(url);
        c.toBlob(function (b) { b ? lire(b, f.name.replace(/\.[^.]+$/, '') + '.jpg', 'image/jpeg') : lire(f, f.name, f.type); }, 'image/jpeg', 0.85);
      };
      img.onerror = function () { URL.revokeObjectURL(url); lire(f, f.name, f.type || ''); };
      img.src = url;
    });
  }
  function deposer(cle, f) {
    if (occupe) return;
    if (f.size > 10 * 1024 * 1024 && !/^image\//.test(f.type || '')) return message('Le fichier est trop lourd (10 Mo maximum).');
    if (!/pdf|image|heic|heif/i.test((f.type || '') + f.name)) return message('Merci de déposer un PDF ou une photo.');
    occupe = cle; afficher(); message('');
    preparer(f).then(function (fichier) { return appel('public.depotEnvoyer', { cle: cle, fichier: fichier }); })
      .then(function (r) { occupe = ''; d = r; afficher(); if (!d.complet) message('Document bien reçu, merci.', 'ok'); })
      .catch(function (er) { occupe = ''; afficher(); message(er.message); });
  }
  if (!jeton) { $('etat').className = 'erreur'; $('etat').textContent = 'Lien incomplet. Utilisez le lien reçu de la paroisse.'; return; }
  appel('public.depot').then(function (r) { d = r; $('etat').style.display = 'none'; $('sous').textContent = r.paroisse || $('sous').textContent; afficher(); })
    .catch(function (er) { $('etat').className = 'erreur'; $('etat').textContent = er.message; });
})();
</script>
</body></html>
